# Override with environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, ...
db.url=jdbc:postgresql://localhost:5432/documents
db.username=postgres
db.password=
user.service.url=http://localhost:8081
moderation.service.url=http://localhost:8082
ride.service.url=http://localhost:8084
# Required for RS256. Base64 DER SubjectPublicKeyInfo or public PEM text.
# Environment variables: JWT_PUBLIC_KEY or JWT_PUBLIC_KEY_PATH (preferred)
# jwt.public.key=
# jwt.public.key.path=/path/to/public.pem
# Optional local font with Cyrillic glyphs for PDF (font is NOT bundled):
# pdf.font.path=/path/to/DejaVuSans.ttf

# Must match User Service JWT_ISSUER.
jwt.issuer=scooter-user-service
