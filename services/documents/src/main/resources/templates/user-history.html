<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>История поездок</title>
    <style th:utext="${inlineCss}"></style>
</head>
<body>
<h1>История поездок</h1>
<p><b>Пользователь:</b> <span th:text="${doc.userFullName}"></span> (<span th:text="${doc.userLogin}"></span>)</p>
<p><b>Период:</b> <span th:text="${doc.from}"></span> — <span th:text="${doc.to}"></span></p>
<table>
    <thead>
    <tr>
        <th>Поездка</th>
        <th>Самокат</th>
        <th>Начало</th>
        <th>Окончание</th>
        <th>Сумма</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${doc.rides}">
        <td th:text="${r.rideId}"></td>
        <td th:text="${r.numberPlate}"></td>
        <td th:text="${r.startedAt}"></td>
        <td th:text="${r.finishedAt}"></td>
        <td><span th:text="${r.amount}"></span> <span th:text="${r.currency}"></span></td>
    </tr>
    </tbody>
</table>
</body>
</html>
