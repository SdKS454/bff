<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Админка блокировок</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<header class="topbar">
    <h1 class="topbar__title">Админка блокировок</h1>
    <a class="btn btn--ghost" hidden id="scooters-link">Управление самокатами</a>
    <button class="btn btn--ghost" id="logout-btn" type="button">Выйти</button>
</header>
<main class="page">
    <div class="message" hidden id="message" role="alert"></div>
    <section hidden id="content">
        <div class="toolbar">
            <div aria-label="Фильтр пользователей" class="filters" role="group">
                <button class="btn btn--filter is-active" data-filter="all" type="button">Все</button>
                <button class="btn btn--filter" data-filter="active" type="button">Активные</button>
                <button class="btn btn--filter" data-filter="blocked" type="button">Заблокированные</button>
            </div>
            <button class="btn btn--ghost" id="refresh-btn" type="button">Обновить</button>
        </div>
        <div class="table-wrap">
            <table class="users-table">
                <thead>
                <tr>
                    <th>Логин</th>
                    <th>Имя</th>
                    <th>Статус</th>
                    <th>Причина</th>
                    <th>Заблокирован с</th>
                    <th>До</th>
                    <th>Действие</th>
                </tr>
                </thead>
                <tbody id="users-tbody">
                <tr class="table-state">
                    <td colspan="7">Загрузка…</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<div class="modal" hidden id="ban-modal">
    <div class="modal__overlay" data-close="true"></div>
    <div aria-modal="true" class="modal__dialog" role="dialog">
        <h2 class="modal__title">Блокировка пользователя</h2>
        <p class="modal__user" id="ban-modal-user"></p>
        <label class="field">
            <span class="field__label">Причина блокировки</span>
            <select class="field__control" id="ban-reason">
                <option disabled selected value="">Выберите причину</option>
            </select>
        </label>
        <p class="modal__duration" id="ban-duration"></p>
        <div class="message message--inline message--error" hidden id="ban-error"></div>
        <div class="modal__actions">
            <button class="btn btn--ghost" id="ban-cancel" type="button">Отмена</button>
            <button class="btn btn--danger" disabled id="ban-confirm" type="button">Заблокировать</button>
        </div>
    </div>
</div>
<div class="modal" hidden id="unban-modal">
    <div class="modal__overlay" data-close="true"></div>
    <div aria-modal="true" class="modal__dialog" role="dialog">
        <h2 class="modal__title">Разблокировка</h2>
        <p class="modal__user" id="unban-modal-text"></p>
        <div class="message message--inline message--error" hidden id="unban-error"></div>
        <div class="modal__actions">
            <button class="btn btn--ghost" id="unban-cancel" type="button">Отмена</button>
            <button class="btn btn--primary" id="unban-confirm" type="button">Да</button>
        </div>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/users.js"></script>
</body>
</html>
