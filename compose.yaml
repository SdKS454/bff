name: kicksharing
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kicksharing
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
      TZ: UTC
    ports: ["127.0.0.1:54320:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./local-stack/init-databases.sh:/docker-entrypoint-initdb.d/001-databases.sh:ro
      - ./services/user/db/001_schema.sql:/schemas/user.sql:ro
      - ./services/moderation/src/main/resources/schema.sql:/schemas/moderation.sql:ro
      - ./services/scooter/db.sql:/schemas/scooter.sql:ro
      - ./services/ride/db/schema.sql:/schemas/ride.sql:ro
      - ./services/documents/src/main/resources/schema.sql:/schemas/documents.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kicksharing -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 40
  migrate:
    image: postgres:16
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: kicksharing
      PGPASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
    volumes:
      - ./local-stack/migrations:/migrations:ro
    entrypoint: ["sh", "/migrations/run.sh"]
  keys:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    entrypoint: ["sh", "/opt/stack/init-keys.sh"]
    volumes:
      - user-keys:/keys
      - public-key:/public
      - service-key:/service-key
  user:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
    environment:
      JAVA_OPTS: "-Djava.security.properties=/opt/stack/java-security.properties -Xms32m -Xmx256m -Djava.awt.headless=true -Dfile.encoding=UTF-8"
      APP_NAME: user
      TZ: UTC
      DB_URL: jdbc:postgresql://postgres:5432/user
      DB_USER: kicksharing
      DB_USERNAME: kicksharing
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
      JWT_PRIVATE_KEY_PATH: "/keys/private.pem"
      JWT_PUBLIC_KEY_PATH: "/keys/public.pem"
      MODERATION_BASE_URL: "http://moderation:8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8082,http://127.0.0.1:8082"
    volumes:
      - ./local-stack/java-security.properties:/opt/stack/java-security.properties:ro
      - user-keys:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/users/exists?login=healthcheck') = 200"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
  moderation:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
      user: {condition: service_healthy}
    environment:
      JAVA_OPTS: "-Djava.security.properties=/opt/stack/java-security.properties -Xms32m -Xmx256m -Djava.awt.headless=true -Dfile.encoding=UTF-8"
      APP_NAME: moderation
      TZ: UTC
      DB_URL: jdbc:postgresql://postgres:5432/moderation
      DB_USER: kicksharing
      DB_USERNAME: kicksharing
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
      USER_BASE_URL: "http://user:8080"
      ADMIN_USER_BASE_URL: "http://localhost:8081"
      BFF_LOGIN_URL: "http://localhost:8080/login.jsp"
    volumes:
      - ./local-stack/java-security.properties:/opt/stack/java-security.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/admin/users.html') = 200"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
  scooter:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
      user: {condition: service_healthy}
    environment:
      JAVA_OPTS: "-Djava.security.properties=/opt/stack/java-security.properties -Xms32m -Xmx256m -Djava.awt.headless=true -Dfile.encoding=UTF-8"
      APP_NAME: scooter
      TZ: UTC
      DB_URL: jdbc:postgresql://postgres:5432/scooter
      DB_USER: kicksharing
      DB_USERNAME: kicksharing
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
      USER_SERVICE_URL: "http://user:8080"
      NEED_SERVICE_KEY: "true"
    volumes:
      - ./local-stack/java-security.properties:/opt/stack/java-security.properties:ro
      - service-key:/service-key:ro
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/scooters') = 401"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
  ride:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
      user: {condition: service_healthy}
      scooter: {condition: service_healthy}
    environment:
      JAVA_OPTS: "-Djava.security.properties=/opt/stack/java-security.properties -Xms32m -Xmx256m -Djava.awt.headless=true -Dfile.encoding=UTF-8"
      APP_NAME: ride
      TZ: UTC
      DB_URL: jdbc:postgresql://postgres:5432/ride
      DB_USER: kicksharing
      DB_USERNAME: kicksharing
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
      USER_SERVICE_URL: "http://user:8080"
      SCOOTER_SERVICE_URL: "http://scooter:8080"
      NEED_SERVICE_KEY: "true"
      PAYMENT_MODE: "educational"
    volumes:
      - ./local-stack/java-security.properties:/opt/stack/java-security.properties:ro
      - service-key:/service-key:ro
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/rates') = 401"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
  documents:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8085:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      keys: {condition: service_completed_successfully}
      user: {condition: service_healthy}
      moderation: {condition: service_healthy}
    environment:
      JAVA_OPTS: "-Djava.security.properties=/opt/stack/java-security.properties -Xms32m -Xmx512m -Djava.awt.headless=true -Dfile.encoding=UTF-8"
      APP_NAME: documents
      TZ: UTC
      DB_URL: jdbc:postgresql://postgres:5432/documents
      DB_USER: kicksharing
      DB_USERNAME: kicksharing
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-kicksharing-local-only}
      USER_SERVICE_URL: "http://user:8080"
      MODERATION_SERVICE_URL: "http://moderation:8080"
      RIDE_SERVICE_URL: "http://ride:8080"
      JWT_PUBLIC_KEY_PATH: "/public/public.pem"
      PDF_FONT_PATH: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
    volumes:
      - ./local-stack/java-security.properties:/opt/stack/java-security.properties:ro
      - public-key:/public:ro
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/api/documents/generate') = 405"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
  bff:
    image: kicksharing-stack:local
    build:
      context: .
      dockerfile: local-stack/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      user: {condition: service_healthy}
      moderation: {condition: service_healthy}
      scooter: {condition: service_healthy}
      ride: {condition: service_healthy}
      documents: {condition: service_healthy}
    environment:
      APP_NAME: bff
      TZ: UTC
      MODERATION_PANEL_URL: "http://localhost:8082/admin/users.html"
      JAVA_OPTS: "-Djava.security.properties=/opt/stack/java-security.properties -Xms32m -Xmx256m -Dfile.encoding=UTF-8 -Duser.service.url=http://user:8080 -Dscooter.service.url=http://scooter:8080 -Dride.service.url=http://ride:8080 -Ddocument.service.url=http://documents:8080"
    volumes:
      - ./local-stack/java-security.properties:/opt/stack/java-security.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "test $$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/login.jsp') = 302"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 15s
volumes:
  postgres-data:
  user-keys:
  public-key:
  service-key:
