name: Verify submission
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      unit-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['54321:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PDF_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:54321/postgres
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Java regression suites
        run: |
          mvn -B clean verify dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
          for service in user moderation scooter ride documents; do
            mvn -B -f services/$service/pom.xml verify
          done
      - run: npm test
      - run: BFF_TEST_CONTEXT='' npm run test:e2e
      - name: Build and start real services
        run: docker compose -p kicksharing-full-check up --build -d
      - name: Full API and browser acceptance
        run: node scripts/check-full-stack.cjs
      - name: Submission features and ownership
        run: node scripts/check-submission.cjs
      - name: Restart and data persistence
        run: node scripts/check-stack-recovery.cjs
      - name: Collect diagnostics
        if: always()
        run: mkdir -p target && docker compose -p kicksharing-full-check logs --no-color > target/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            target/*reports/
            services/*/target/*reports/
            target/*downloads/
            target/submission-*.pdf
            target/submission-*.png
            target/compose.log
      - if: always()
        run: docker compose -p kicksharing-full-check down -v
